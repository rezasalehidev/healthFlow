name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libraries
        run: pnpm build:common && pnpm build:redis && pnpm build:messaging

      - name: Generate Prisma clients
        env:
          DATABASE_URL: postgresql://healthflow:healthflow@localhost:5432/healthflow?schema=auth
        run: |
          pnpm --filter @healthflow/auth-service prisma:generate
          pnpm --filter @healthflow/patient-service prisma:generate
          pnpm --filter @healthflow/doctor-service prisma:generate
          pnpm --filter @healthflow/appointment-service prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build apps
        run: pnpm build
